<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب خدمة · رحلة ورق</title>
<link rel="canonical" href="https://waraq-agency.com/request.html">
<meta property="og:type" content="website">
<meta property="og:title" content="اطلب خدمة · رحلة ورق">
<meta property="og:url" content="https://waraq-agency.com/request.html">
<meta property="og:description" content="سجّل طلبك لدى وكالة رحلة ورق للدعاية والإعلان: تسويق كتابك عن طريق مسوقين، حملات جاهزة، ومعارض الكتاب.">
<meta property="og:image" content="https://waraq-agency.com/img/mark-512.png">
<meta property="og:locale" content="ar_SA">
<meta name="description" content="سجّل طلبك لدى وكالة رحلة ورق للدعاية والإعلان: بياناتك، كتابك وحالته، والخدمة اللي تحتاجها.">
<meta name="theme-color" content="#0F30B3">
<link rel="icon" type="image/png" sizes="32x32" href="img/mark-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/mark-192.png">
<link rel="apple-touch-icon" href="img/mark-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#16223a; --muted:#56637a; --rule:#cfd6dc; --mark:#ffd84a; --bad:#b3372f; --ok:#2f7d4f;
  --display:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
  --body:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --lift:0 1px 0 var(--rule),0 22px 34px -18px rgba(22,34,58,.32),0 3px 8px rgba(22,34,58,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--muted) var(--paper);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.8;caret-color:var(--ink)}
::selection{background:var(--mark);color:var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.45}
p{margin:0;text-wrap:pretty}
a{color:inherit;text-underline-offset:5px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

.mast{display:flex;gap:10px 24px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1}
.brand span{color:var(--muted);font-size:.95rem}
.back{font-family:var(--display);font-size:.95rem;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.back:hover{text-decoration:underline}
.back svg{width:1em;height:1em}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.6;text-decoration:none;border:2px solid var(--ink);padding:10px 24px;background:var(--ink);color:var(--sheet);cursor:pointer;transition:background-color .18s,color .18s,transform .18s var(--ease)}
.btn:hover{background:var(--mark);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--sheet)}
.btn[disabled]{cursor:progress;opacity:.75}
.spin{display:none;width:1em;height:1em;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn[aria-busy="true"] .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.intro{padding:52px 0 34px;max-width:40em}
h1{font-size:clamp(2.1rem,5vw,3.3rem);font-weight:800;line-height:1.4}
.hl{background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .42em;padding:0 .08em}
.intro p{font-size:1.12rem;margin-top:14px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:start;padding-bottom:80px;max-width:900px}
.sheet{background:var(--sheet);box-shadow:var(--lift);padding:8px 34px 34px;position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;width:18px;height:18px;border:1.5px solid var(--ink)}
.sheet::before{top:-10px;right:-10px;border-left:0;border-bottom:0}
.sheet::after{bottom:-10px;left:-10px;border-right:0;border-top:0}

fieldset.part{border:0;margin:0;padding:28px 0 6px;border-bottom:1px solid var(--rule);min-width:0}
fieldset.part:last-of-type{border-bottom:0}
.part>legend{display:flex;align-items:baseline;gap:12px;padding:0;margin-bottom:18px;float:right;width:100%}
.part>legend+*{clear:both}
.part>legend b{font-family:var(--display);font-size:.85rem;font-weight:700;color:var(--muted)}
.part>legend span{font-family:var(--display);font-size:1.3rem;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}
.full{grid-column:1/-1}
.f label,.f .lab{display:block;font-family:var(--display);font-weight:700;font-size:.9rem;margin-bottom:6px}
.f label small,.f .lab small{font-weight:500;color:var(--muted);font-size:.8rem}
.f input[type=text],.f input[type=tel],.f input[type=email],.f input[type=url],.f input[type=number],.f input[type=date],.f select,.f textarea{width:100%;font:inherit;font-size:1.02rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:0;padding:9px 12px;transition:border-color .15s,background-color .15s}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:left 18px center,left 12px center;background-size:6px 6px;background-repeat:no-repeat;padding-left:34px}
.f input:hover,.f select:hover,.f textarea:hover{border-color:var(--muted)}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--ink);background-color:var(--sheet)}
.f input[aria-invalid="true"]{border-color:var(--bad);background-color:#fff6f5}
.f textarea{min-height:110px;resize:vertical}
.f .note{font-size:.85rem;color:var(--muted);margin-top:5px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks label{margin:0;cursor:pointer;font-family:var(--display);font-weight:500;font-size:.92rem;border:1.5px solid var(--rule);background:var(--paper);padding:7px 16px;display:inline-flex;gap:8px;align-items:center;transition:border-color .15s,background-color .15s}
.picks label:hover{border-color:var(--ink)}
.picks input{position:absolute;opacity:0;width:1px;height:1px}
.picks label:has(input:checked){background:var(--mark);border-color:var(--ink);font-weight:700}
.picks label:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
/* الحملة الجاهزة المختارة: مميزاتها وزر تغييرها */
.picks label[hidden]{display:none}
.pkginfo{margin-top:10px;border:1.5px solid var(--rule);border-inline-start:4px solid var(--ink);background:var(--sheet);padding:12px 16px}
.pkginfo[hidden]{display:none}
.pkginfo .pkg-h{font-family:var(--display);font-weight:700;font-size:.9rem;margin:0 0 6px}
.pkginfo ul{margin:0 0 10px;padding-inline-start:20px;font-size:.95rem;line-height:1.8}
.pkgchange{font:inherit;font-family:var(--display);font-weight:700;font-size:.88rem;color:var(--ink);background:none;border:1.5px solid var(--ink);padding:6px 14px;cursor:pointer}
.pkgchange:hover{background:var(--mark)}
.pkgbtns{display:flex;flex-wrap:wrap;gap:8px}
/* خدمة الحملة المختارة: مقفولة */
.picks label.locked{cursor:default}
.picks label.locked::after{content:"";width:9px;height:9px;border:1.5px solid currentColor;border-radius:2px;margin-inline-start:2px;box-shadow:inset 0 -4px 0 currentColor;opacity:.7}
#lock-note{flex-basis:100%;margin:6px 0 0}
.picks[hidden]{display:none}
.who-fixed{margin:4px 0 0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.who-fixed b{font-family:var(--display);font-size:1.35rem;font-weight:800;color:var(--ink);line-height:1.5;background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .38em;padding:0 .08em}
.who-fixed small{font-size:.85rem;color:var(--muted)}
.who-fixed[hidden]{display:none}
/* خطوتين: مؤشر الخطوات وملخص الطلب */
.consent[hidden],.s2only[hidden],fieldset.part[hidden]{display:none}
.steps-ind{list-style:none;display:flex;gap:10px;margin:0 0 18px;padding:0;font-family:var(--display);font-size:.9rem;font-weight:700;color:var(--muted)}
.steps-ind li{display:flex;align-items:center;gap:8px;flex:1;border-bottom:3px solid var(--rule);padding-bottom:8px}
.steps-ind li span{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--rule);font-size:.85rem}
.steps-ind li[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.steps-ind li[aria-current="step"] span{background:var(--ink);border-color:var(--ink);color:#fff}
.review{padding:24px 0 8px;border-bottom:1px solid var(--rule)}
.review[hidden]{display:none}
.rv-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.rv-head h2{font-size:1.25rem;font-weight:800;margin:0}
.rv-head h2:focus{outline:none}
.rv-edit{font:inherit;font-family:var(--display);font-weight:700;font-size:.88rem;color:var(--ink);background:none;border:1.5px solid var(--ink);padding:6px 16px;cursor:pointer}
.rv-edit:hover{background:var(--mark)}
.rv-edit:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.review dl{margin:0;background:var(--paper);border:1px solid var(--rule)}
.review dl>div{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 16px;padding:10px 16px;border-top:1px solid var(--rule)}
.review dl>div:first-child{border-top:0}
.review dt{font-family:var(--display);font-weight:700;font-size:.88rem;color:var(--muted)}
.review dd{margin:0;overflow-wrap:anywhere}
.rv-next{font-size:.92rem;color:var(--muted);margin:12px 0 0}
@media (max-width:560px){.review dl>div{grid-template-columns:1fr}}
.pkginfo.pkgnone{border:0;background:none;padding:0;margin-top:0}
.pkgadd{border-style:dashed}
.pkgremove{border-color:var(--rule);color:var(--muted)}
.pkgremove:hover{background:none;border-color:var(--bad);color:var(--bad)}
.pkgchange:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.picks.big label{padding:12px 22px;font-size:1rem}
.picks[aria-invalid="true"] label{border-color:var(--bad)}
.hp{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.send{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding-top:26px}
.err{color:var(--bad);font-family:var(--display);font-size:.92rem}
.err:empty{display:none}
.agree{font-size:.88rem;color:var(--muted);flex-basis:100%}
/* موافقة على سياسة الخصوصية قبل الإرسال */
.consent{flex-basis:100%;display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.95rem;line-height:1.7}
.consent input{width:20px;height:20px;margin-top:4px;flex-shrink:0;accent-color:var(--ink);cursor:pointer}
.consent a{color:inherit}
.consent:has(input[aria-invalid="true"]) span{color:var(--bad)}
#consent-err{flex-basis:100%;margin:-6px 0 0}

aside.after{position:static}  /* «بعد ما ترسل الطلب» تحت النموذج مرة، على الكمبيوتر والجوال */
aside.after h2{font-size:1.1rem;font-weight:800;margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.steps li{position:relative;padding:16px 26px 14px 0;border-bottom:1px solid var(--rule)}
.steps li::before{content:"";position:absolute;right:0;top:24px;width:12px;height:12px;background:var(--mark);border:2px solid var(--ink)}
.steps b{display:block;font-family:var(--display);font-size:.98rem}
.steps span{color:var(--muted);font-size:.95rem}
.after .alt{margin-top:18px;font-size:.95rem;color:var(--muted)}
.soc{display:inline-flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--display);font-size:.9rem;font-weight:500}
.soc a:hover{background:var(--mark);text-decoration:none}

.done{background:var(--sheet);box-shadow:var(--lift);padding:40px 36px;text-align:start}
.done svg{width:44px;height:44px;margin-bottom:14px}
.done h2{font-size:1.7rem;font-weight:800;margin-bottom:8px}
.done h2 span{background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .42em}
.done p{color:var(--muted);font-size:1.05rem;max-width:34em}
.done .ref{font-family:var(--display);font-weight:800;color:var(--ink);direction:ltr;unicode-bidi:isolate;letter-spacing:.05em}
.done .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.done textarea{width:100%;min-height:180px;font:inherit;font-size:1rem;border:1px solid var(--rule);padding:10px 12px;background:var(--paper);margin-top:16px}
.warn{background:#fff4c7;border:1px solid #e3c44a;padding:10px 14px;font-family:var(--display);font-size:.92rem;margin-top:14px}
.copied{font-family:var(--display);font-size:.9rem;color:var(--ok)}

body.loading .intro,body.loading .layout{visibility:hidden}
.preview [data-field],.preview fieldset.part,.preview [data-box]{transition:outline-color .15s}
.preview [data-field]:hover,.preview [data-box]:hover{outline:2px dashed rgba(22,34,58,.35);outline-offset:4px;cursor:pointer}
.preview .sel-sec{outline:3px solid var(--mark)!important;outline-offset:4px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:28px}
}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .sheet{padding:4px 18px 26px}
  .done{padding:28px 20px}
  .brand span{display:none}
  .intro{padding:36px 0 26px}
}
/* خطأ تحت الحقل */
.ferr{color:var(--bad);font-family:var(--display);font-size:.88rem;margin-top:6px}
.f select[aria-invalid="true"],.f textarea[aria-invalid="true"]{border-color:var(--bad);background-color:#fff6f5}
/* «+ خدمات أخرى» */
.morebtn{font-family:var(--display);font-weight:700;font-size:.92rem;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);padding:6px 16px;cursor:pointer}
.morebtn:hover,.morebtn[aria-expanded="true"]{background:var(--mark);border-style:solid}
.morebox{margin-top:12px;padding:12px;border:1.5px solid var(--rule);background:var(--paper);display:grid;gap:10px}
.morebox .picks label{background:var(--sheet)}
.otherlab{font-family:var(--display);font-weight:700;font-size:.88rem}
.addcustom{display:grid;gap:6px}
.addcustom-row{display:flex;gap:8px;align-items:stretch}
.addcustom .o-name{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:0;padding:9px 12px}
.addcustom .o-name:focus{outline:0;border-color:var(--ink)}
.addcustom .addother{flex-shrink:0}
.cmsg{margin:0;font-family:var(--display);font-size:.85rem;color:var(--muted)}
.cmsg:empty{display:none}
.picks label.custom{border-style:dashed}
.orows{display:grid;gap:10px}
.orow{border:1.5px solid var(--rule);background:var(--sheet);padding:10px;display:grid;gap:8px}
.orow:focus-within{border-color:var(--ink)}
.orow-top{display:flex;gap:8px;align-items:center}
.orow .o-name,.orow .o-desc{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:0;padding:9px 12px}
.orow .o-name{flex:1;font-family:var(--display);font-weight:700}
.orow .o-name:focus,.orow .o-desc:focus{outline:0;border-color:var(--ink);background:var(--sheet)}
.orow .o-desc{min-height:76px;resize:vertical}
.addother{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.9rem;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);padding:7px 16px;cursor:pointer}
.addother span{font-size:1.15rem;line-height:1}
.addother:hover:not(:disabled){background:var(--mark);border-style:solid}
.addother:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:no-preference){.morebox:not([hidden]){animation:condIn .3s var(--ease) both}}
/* «+ أضف خدمة» */
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.srows{display:grid;gap:12px}
.srow{border:1.5px solid var(--rule);background:var(--paper);padding:10px;display:grid;gap:10px}
.srow:has(select:focus),.srow:has(textarea:focus){border-color:var(--ink)}
.srow-top{display:flex;gap:8px;align-items:center}
.srow-top select{flex:1}
.srow textarea{min-height:84px}
.srow select,.srow textarea{background-color:var(--sheet)!important}
.srow-x{flex-shrink:0;width:40px;height:40px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font-size:1.3rem;line-height:1;cursor:pointer}
.srow-x:hover{border-color:var(--ink);background:#fff4c7}
.addsvc{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.95rem;border:2px dashed var(--ink);background:transparent;color:var(--ink);padding:9px 18px;cursor:pointer}
.addsvc span{font-size:1.2rem;line-height:1}
.addsvc:hover:not(:disabled){background:var(--mark);border-style:solid}
.addsvc:disabled{opacity:.45;cursor:not-allowed}
/* تفاصيل الخدمة: خانات تطلع بس لما العميل يختار الخدمة */
.f.cond{position:relative;padding-inline-start:16px}
.f.cond::before{content:"";position:absolute;inset-inline-start:0;top:4px;bottom:4px;width:1px;background:var(--ink);opacity:.35}
.f.cond>.lab::after,.f.cond>label::after{content:"";display:inline-block;width:.5em;height:.5em;background:var(--mark);border:1px solid var(--ink);margin-inline-start:8px;vertical-align:.1em}
@media (prefers-reduced-motion:no-preference){
  .hl{animation:mark 1s .3s var(--ease) both}
  @keyframes mark{from{background-size:0% .42em}to{background-size:100% .42em}}
  .f.cond:not([hidden]){animation:condIn .3s var(--ease) both}
  @keyframes condIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* شعار رحلة ورق في رأس الصفحة (ألوان الموقع ما تغيّرت) */
.brand{align-items:center}
.brand .logo{display:block;height:56px;width:auto}
@media (max-width:600px){.brand .logo{height:46px}}
.brand .logo-mark{display:block;height:40px;width:40px}

/* ألوان الشعار: أزرق قارب «رحلة ورق» للأزرار، وأزرق فاتح للتظليل بدل الأصفر. لون الكتابة كحلي مثل ما هو */
:root{--brand:#0F30B3;--brand-2:#0B248A;--mark:#c9d4f7}
.btn:not(.line):not(.danger){background:var(--brand);border-color:var(--brand);color:#fff}
.btn:not(.line):not(.danger):hover{background:var(--mark);border-color:var(--brand);color:var(--brand-2)}
.btn.line:hover{background:var(--brand);border-color:var(--brand);color:#fff}

/* «إصدار تجريبي» في نص الشريط العلوي */
.mast{position:relative}
.beta{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:.78rem;line-height:1.6;color:var(--brand,#0F30B3);background:var(--mark);border:1.5px solid var(--brand,#0F30B3);padding:2px 10px;white-space:nowrap;pointer-events:none}
@media (max-width:420px){.beta{font-size:.7rem;padding:1px 7px}}
</style>
</head>
<body class="loading">
<div class="wrap">
  <header class="mast">
    <a class="brand" href="index.html"><img class="logo" src="img/wordmark-blue.png" alt="رحلة ورق" width="56" height="46"><span>وكالة تسويق للكتب</span></a>
    <span class="beta">إصدار تجريبي</span>
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>الرجوع للموقع</a>
  </header>

  <div class="intro" id="intro" data-box="intro"></div>

  <div class="layout">
