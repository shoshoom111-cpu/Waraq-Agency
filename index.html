<style>
/* The site is set like the opening pages of a book: a contents sheet (فهرس) with dot leaders is the navigation,
   every section carries its folio, and one highlighter stroke marks the word that matters. Single paper world, by choice. */
:root{
  --paper:#f3f5f1; --sheet:#ffffff; --ink:#16223a; --muted:#56637a; --rule:#cfd6dc; --mark:#ffd84a;
  --ink-2:#1e2c48; --ink-line:#6c7b98; --ink-soft:#aab6cc; --ink-faint:#8f9cb5; --ok:#2f7d4f;
  --display:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
  --body:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --lift:0 1px 0 var(--rule),0 22px 34px -18px rgba(22,34,58,.32),0 3px 8px rgba(22,34,58,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-color:var(--muted) var(--paper);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.8;caret-color:var(--ink)}
::selection{background:var(--mark);color:var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.45}
p{margin:0;text-wrap:pretty}
a{color:inherit;text-underline-offset:5px;text-decoration-thickness:1.5px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.skip{position:absolute;right:12px;top:-60px;background:var(--ink);color:var(--sheet);padding:8px 14px;z-index:30;font-family:var(--display)}
.skip:focus{top:12px}
[id]{scroll-margin-top:84px}

/* masthead */
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,241,.94);-webkit-backdrop-filter:saturate(1.2) blur(8px);backdrop-filter:saturate(1.2) blur(8px)}
.mast{display:flex;gap:10px 24px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;flex-shrink:0}
.brand b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1}
.brand span{color:var(--muted);font-size:.95rem}
.mast nav{display:flex;gap:6px 22px;align-items:center;font-size:.98rem}
.mast nav a{text-decoration:none;white-space:nowrap}
.mast nav a:not(.btn){padding:4px 0;background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .2em/0 .38em;transition:background-size .3s var(--ease)}
.mast nav a:not(.btn):hover,.mast nav a[aria-current="true"]{background-size:100% .38em}

.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.95rem;line-height:1.6;text-decoration:none;border:2px solid var(--ink);padding:9px 20px;background:var(--ink);color:var(--sheet);cursor:pointer;transition:background-color .18s,color .18s,border-color .18s,transform .18s var(--ease)}
.btn:hover{background:var(--mark);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.line{background:transparent;color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--sheet)}
.btn[disabled]{cursor:progress;opacity:.75}
.btn svg{width:1.05em;height:1.05em;flex-shrink:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,46rem);gap:56px;align-items:center;padding:72px 0 84px}
h1{font-size:clamp(2.4rem,6.2vw,4.4rem);font-weight:800;line-height:1.38}
.hl{background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .42em;padding:0 .08em}
.lead{font-size:1.18rem;max-width:33em;margin:24px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.for{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-family:var(--display);font-size:.9rem;color:var(--muted);list-style:none;padding:0}
.for li{display:flex;align-items:center;gap:9px}
.for li::before{content:"";width:.62em;height:.62em;background:var(--mark);border:1.5px solid var(--ink)}

/* contents sheet */
.sheet{position:relative;background:var(--sheet);padding:32px 30px 26px;transform:rotate(-1.6deg);box-shadow:var(--lift);transition:transform .5s var(--ease)}
.sheet:hover{transform:rotate(-.6deg)}
.sheet::before,.sheet::after{content:"";position:absolute;width:18px;height:18px;border:1.5px solid var(--ink)}
.sheet::before{top:-10px;right:-10px;border-left:0;border-bottom:0}
.sheet::after{bottom:-10px;left:-10px;border-right:0;border-top:0}
.sheet h2{font-size:1.25rem;font-weight:800;text-align:center;margin-bottom:12px}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;align-items:baseline;gap:8px;text-decoration:none;padding:6px 0;font-size:1.05rem}
.toc a i{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-.3em)}
.toc a b{font-family:var(--display);font-weight:700;font-size:.95rem;min-width:1ch;text-align:left}
.toc a span{background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/0 .42em;transition:background-size .3s var(--ease)}
.toc a:hover span,.toc a:focus-visible span{background-size:100% .42em}
.sheet .foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);text-align:center;color:var(--muted);font-size:.85rem;font-family:var(--display)}

/* sections */
section{padding:76px 0;border-top:1px solid var(--rule)}
.head{display:flex;align-items:baseline;gap:16px;margin-bottom:34px}
.folio{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--muted);white-space:nowrap}
.head h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800}
.head p{color:var(--muted);margin-inline-start:auto;font-size:1rem;max-width:22em}

/* services as index entries */
.svc{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.svc li{margin:0 -12px;border-bottom:1px solid var(--rule);transition:background-color .25s}
.svc li:hover,.svc li:has(details[open]){background:var(--sheet)}
.svc summary{display:grid;grid-template-columns:3.4rem 1fr auto;gap:10px 28px;align-items:center;padding:22px 12px;cursor:pointer;list-style:none}
.svc summary::-webkit-details-marker{display:none}
.svc-b{padding:0 12px 24px;margin-inline-start:calc(3.4rem + 28px)}
.chev{width:22px;height:22px;flex-shrink:0;fill:none;stroke:var(--ink);stroke-width:2;transition:transform .25s var(--ease)}
details[open]>summary .chev{transform:rotate(180deg)}
summary:hover .chev{stroke:var(--ink)}
.svc .n{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;color:#858f9b;transition:color .25s}
.svc li:hover .n,.svc details[open] .n{color:var(--ink)}
.svc h3{font-size:1.25rem;font-weight:700}
.svc p{max-width:36em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-family:var(--display);font-size:.78rem;font-weight:500}
.tags span{border:1px solid var(--ink);padding:1px 10px}

/* campaigns (ready packages) */
.aud{display:inline-flex;margin-bottom:24px;border:2px solid var(--ink)}
.aud button{font-family:var(--display);font-weight:700;font-size:.95rem;border:0;background:transparent;color:var(--ink);padding:9px 24px;cursor:pointer;transition:background-color .2s,color .2s}
.aud button:hover{background:rgba(255,216,74,.45)}
.aud button[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.svc-cta{display:flex;justify-content:center;margin-top:28px}
.svc-cards .card .desc{margin-top:-6px}
.card{position:relative;background:var(--sheet);border:1.5px solid var(--rule);padding:24px 22px 22px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,box-shadow .3s var(--ease),transform .3s var(--ease)}
.card:hover{border-color:var(--ink);box-shadow:var(--lift);transform:translateY(-3px)}
.card.star{border:2px solid var(--ink);background:linear-gradient(var(--mark),var(--mark)) top/100% 7px no-repeat,var(--sheet);padding-top:28px}
.card .lbl{font-family:var(--display);font-size:.78rem;font-weight:700;color:var(--muted)}
.card.star .lbl{color:var(--ink);align-self:flex-start;background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .5em}
.card h3{font-size:1.28rem;font-weight:800}
.card p{font-size:1rem;color:var(--muted)}
.card .desc{margin-top:-6px;line-height:1.7}
.card .more ul{margin-top:0}
.card ul{margin:10px 0 0;padding:0;list-style:none;font-size:.98rem;border-top:1px dotted var(--rule)}
.card .grow{flex:1}
.card .more{border-top:1px dotted var(--rule)}
.card .more summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 2px;cursor:pointer;list-style:none;font-family:var(--display);font-weight:700;font-size:.9rem}
.card .more summary::-webkit-details-marker{display:none}
.card .more summary .chev{width:18px;height:18px}
.card .more[open] summary{padding-bottom:8px}
.card li{padding:6px 0;border-bottom:1px dotted var(--rule)}
.card .btn{align-self:flex-start;margin-top:10px}

/* why */
.why{display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:2px solid var(--ink)}
.why div{padding:26px 24px 4px;border-inline-start:1px solid var(--rule)}
.why div:first-child{border-inline-start:0;padding-inline-start:0}
.why h3{font-size:1.15rem;font-weight:700;margin-bottom:8px}
.why p{font-size:1rem;color:var(--muted)}

/* how */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,5),1fr)}
.steps li{position:relative;padding:28px 16px 0;border-top:2px solid var(--ink)}
.steps li::before{content:"";position:absolute;top:-8px;right:16px;width:14px;height:14px;background:var(--mark);border:2px solid var(--ink)}
.steps h3{font-size:1.08rem;font-weight:700;margin-bottom:6px}
.steps p{font-size:.98rem;color:var(--muted)}

/* bands */
.band{background:var(--sheet);border:2px solid var(--ink);padding:32px 34px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;box-shadow:var(--lift)}
.band h2{font-size:1.55rem;font-weight:800;margin-bottom:4px}
.band h2 span{background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .42em}
.band p{max-width:34em}

/* faq */
.faq{border-top:2px solid var(--ink)}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex-shrink:0;width:22px;height:22px;border:1.5px solid var(--ink);background:linear-gradient(var(--ink),var(--ink)) center/10px 2px no-repeat,linear-gradient(var(--ink),var(--ink)) center/2px 10px no-repeat;transition:background-color .2s}
.faq summary:hover::after{background-color:var(--mark)}
.faq details[open] summary::after{background:linear-gradient(var(--ink),var(--ink)) center/10px 2px no-repeat var(--mark)}
.faq details p{padding:0 0 20px;max-width:46em}

/* dark forms (request + marketers) */
.req{background:var(--ink);color:var(--sheet);border-top:0;caret-color:var(--mark)}
.req ::selection{background:var(--mark);color:var(--ink)}
.req .folio,.req .head p{color:var(--ink-soft)}
.req :focus-visible{outline-color:var(--mark)}
.req form{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
.req label,.req legend{display:block;font-family:var(--display);font-weight:500;font-size:.88rem;margin-bottom:6px;padding:0;color:#e3e8f2}
.req label small{color:var(--ink-faint);font-weight:500;font-size:.8rem}
.req input[type=text],.req input[type=tel],.req textarea{width:100%;font:inherit;color:var(--sheet);background:transparent;border:0;border-bottom:2px solid var(--ink-line);padding:6px 2px;border-radius:0;transition:border-color .2s}
.req input::placeholder,.req textarea::placeholder{color:var(--ink-faint)}
.req input[type=text]:hover,.req textarea:hover{border-bottom-color:var(--ink-soft)}
.req input[type=text]:focus,.req textarea:focus{outline:0;border-bottom-color:var(--mark)}
.req input[aria-invalid="true"]{border-bottom-color:#ff9a8a}
.req textarea{min-height:96px;resize:vertical}
.req fieldset{border:0;margin:0;padding:0;min-width:0}
.full{grid-column:1/-1}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks label{margin:0;cursor:pointer;font-family:var(--display);font-size:.88rem;border:1.5px solid var(--ink-line);padding:6px 15px;display:inline-flex;gap:8px;align-items:center;transition:border-color .15s,background-color .15s,color .15s}
.picks label:hover{border-color:var(--ink-soft)}
.picks input{position:absolute;opacity:0;width:1px;height:1px}
.picks label:has(input:checked){background:var(--mark);color:var(--ink);border-color:var(--mark)}
.picks label:has(input:focus-visible){outline:3px solid var(--mark);outline-offset:2px}
.hp{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.send{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.req .btn{background:var(--mark);color:var(--ink);border-color:var(--mark)}
.req .btn:hover{background:var(--sheet);border-color:var(--sheet)}
.spin{display:none;width:1em;height:1em;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn[aria-busy="true"] .spin{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ffb3a7;font-size:.95rem;font-family:var(--display)}
.err:empty{display:none}

.out{grid-column:1/-1;background:var(--sheet);color:var(--ink);padding:24px 24px 22px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.out .ok{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.out .ok svg{flex-shrink:0;width:34px;height:34px;color:var(--ink)}
.out .ok h3{font-size:1.25rem;font-weight:800}
.out .ok h3 span{background:linear-gradient(var(--mark),var(--mark)) no-repeat right bottom .1em/100% .42em}
.out .ok p{color:var(--muted);font-size:1rem}
.out .ok .ref{font-family:var(--display);font-weight:700;color:var(--ink);direction:ltr;unicode-bidi:isolate}
.out .note{font-family:var(--display);font-size:.9rem;margin-bottom:10px}
.out .note.warn{background:#fff4c7;border:1px solid #e3c44a;padding:8px 12px}
.out label{color:var(--ink)!important}
.out textarea{width:100%;min-height:170px;font:inherit;font-size:1rem;border:1px solid var(--rule);padding:10px 12px;color:var(--ink);background:var(--paper);resize:vertical;caret-color:var(--ink)}
.out .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px}
.out .btn{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.out .btn:hover{background:var(--mark);color:var(--ink);border-color:var(--ink)}
.out .btn.line{background:transparent;color:var(--ink);border-color:var(--ink)}
.out .btn.line:hover{background:var(--ink);color:var(--sheet)}
.out .done{font-family:var(--display);font-size:.9rem;color:var(--ok)}
.out .alt{margin-top:14px;font-size:.98rem;color:var(--muted)}
.out .soc a:hover{color:var(--ink)}
.contact{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.contact p{color:#d5dcea;font-size:1rem}
.soc{display:inline-flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--display);font-size:.9rem;font-weight:500}
.soc a:hover{background:var(--mark);color:var(--ink);text-decoration:none}
.handle{font-family:var(--display);direction:ltr;unicode-bidi:isolate;font-weight:700;letter-spacing:.01em}
.req.alt2{background:var(--ink-2)}
.start{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;background:var(--sheet);color:var(--ink);padding:28px 30px;margin-bottom:30px;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.start h3{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.start h3::after{content:"";display:block;width:3.2em;height:.32em;background:var(--mark);margin-top:4px}
.start p{color:var(--muted);max-width:34em}
.req .start .btn{background:var(--ink);color:var(--sheet);border-color:var(--ink);font-size:1.02rem;padding:11px 26px}
.req .start .btn:hover{background:var(--mark);color:var(--ink)}

footer{padding:30px 0 44px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:baseline;font-size:.95rem;color:var(--muted)}
footer b{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink)}
[hidden]{display:none!important}

/* free text + testimonials (sections added from the editor) */
.prose{border-top:2px solid var(--ink);padding-top:22px;max-width:46em}
.prose p+p{margin-top:14px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;border-top:2px solid var(--ink);padding-top:24px}
.quotes figure{margin:0;background:var(--sheet);border:1.5px solid var(--rule);padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.quotes blockquote{margin:0;font-size:1.05rem}
.quotes blockquote p::before{content:"«"}.quotes blockquote p::after{content:"»"}
.quotes figcaption{display:flex;flex-direction:column;font-family:var(--display);font-size:.9rem;border-top:1px dotted var(--rule);padding-top:10px}
.quotes figcaption span{color:var(--muted);font-size:.82rem}

/* loading + preview inside the editor */
body.loading #site{visibility:hidden}
.preview [data-sec]{transition:outline-color .15s}
.preview [data-sec]:hover{outline:2px dashed rgba(22,34,58,.35);outline-offset:-2px;cursor:pointer}
.preview .sel-sec{outline:3px solid var(--mark)!important;outline-offset:-3px}
.preview .top{position:static}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:44px;padding:44px 0 60px}
  .sheet{width:100%;max-width:420px;margin:0 auto}
  .svc summary{grid-template-columns:2.6rem 1fr auto;gap:10px 16px}
  .svc-b{margin-inline-start:calc(2.6rem + 16px)}
  .pk{grid-template-columns:1fr 1fr}
  .why{grid-template-columns:1fr}
  .why div{border-inline-start:0;padding-inline-start:0;border-bottom:1px solid var(--rule);padding-bottom:20px}
  .steps{grid-template-columns:1fr 1fr;gap:30px 0}
  .head{flex-wrap:wrap}.head p{margin-inline-start:0;flex-basis:100%}
  .req form{grid-template-columns:1fr}
  section{padding:60px 0}
}
@media (max-width:1000px){
  .mast{flex-wrap:wrap;padding:10px 0 0;border-bottom:0}
  .mast nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none;gap:18px;padding:6px 0 8px;border-top:1px solid var(--rule);border-bottom:2px solid var(--ink)}
  .mast nav::-webkit-scrollbar{display:none}
  .mast nav{-webkit-mask-image:linear-gradient(to left,#000 85%,transparent);mask-image:linear-gradient(to left,#000 85%,transparent)}
  .mast nav .btn{display:none}
  .mast .mcta{display:inline-flex}
  [id]{scroll-margin-top:110px}
}
.mcta{display:none;padding:6px 14px;font-size:.88rem}
.req .consent{flex-basis:100%;font-size:.85rem;color:#c9d2e3}.req .consent a{color:inherit}
.mast nav a.xl{font-family:var(--display);font-weight:700;font-size:.88rem;border:1.5px solid var(--ink);padding:4px 12px;background:none}
.mast nav a.xl:hover{background:var(--mark)}
@media (max-width:560px){.pk{grid-template-columns:1fr}}
@media (max-width:460px){body{font-size:17px}.steps{grid-template-columns:1fr}.band{padding:24px 20px}.brand span{display:none}.out{padding:20px 16px}}
@media (prefers-reduced-motion:no-preference){
  .hl{animation:mark 1s .35s var(--ease) both}
  @keyframes mark{from{background-size:0% .42em}to{background-size:100% .42em}}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}.sheet,.sheet:hover{transform:rotate(-1.6deg)}}

/* شعار رحلة ورق في رأس الصفحة (ألوان الموقع ما تغيّرت) */
.brand{align-items:center}
.brand .logo{display:block;height:56px;width:auto}
@media (max-width:600px){.brand .logo{height:46px}}
.brand .logo-mark{display:block;height:40px;width:40px}

/* ألوان الشعار: أزرق قارب «رحلة ورق» للأزرار، وأزرق فاتح للتظليل بدل الأصفر. لون الكتابة كحلي مثل ما هو */
:root{--brand:#0F30B3;--brand-2:#0B248A;--mark:#c9d4f7}
.btn:not(.line):not(.danger){background:var(--brand);border-color:var(--brand);color:#fff}
.btn:not(.line):not(.danger):hover{background:var(--mark);border-color:var(--brand);color:var(--brand-2)}
.btn.line:hover{background:var(--brand);border-color:var(--brand);color:#fff}
/* البطاقات: زاوية ورق مطوية مثل قارب الشعار */
.card::before{content:"";position:absolute;top:-1.5px;left:-1.5px;width:30px;height:30px;pointer-events:none;
  background:linear-gradient(135deg,var(--paper) 0 49%,var(--rule) 49% 51%,var(--mark) 51% 100%);
  filter:drop-shadow(1px 1px 1px rgba(15,48,179,.18));transition:width .25s var(--ease),height .25s var(--ease)}
.card:hover::before{width:38px;height:38px}
.card.star::before{background:linear-gradient(135deg,var(--paper) 0 49%,var(--brand) 49% 51%,var(--mark) 51% 100%)}

/* «إصدار تجريبي» في نص الشريط العلوي */
/* الشريط العلوي على كل الشاشات: صف فيه الشعار | «إصدار تجريبي» بالنص بالضبط | زر الطلب، وتحته صف الأقسام.
   العمودين الجانبيين متساويين عشان المربع يجي في نص الصفحة، ومو فوق روابط الأقسام. */
.mast{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 8px;padding:10px 0 0;border-bottom:0}
.mast .brand{justify-self:start}
.mast .mcta{display:inline-flex;justify-self:end}
.mast nav{grid-column:1/-1;width:100%;overflow-x:auto;scrollbar-width:none;gap:18px;padding:6px 0 8px;border-top:1px solid var(--rule);border-bottom:2px solid var(--ink);-webkit-mask-image:linear-gradient(to left,#000 85%,transparent);mask-image:linear-gradient(to left,#000 85%,transparent)}
.mast nav::-webkit-scrollbar{display:none}
.mast nav .btn{display:none}
[id]{scroll-margin-top:110px}
@media (max-width:380px){.mast .mcta{padding:6px 10px;font-size:.82rem}}
.beta{justify-self:center;font-family:var(--display);font-weight:700;font-size:.78rem;line-height:1.6;color:var(--brand,#0F30B3);background:var(--mark);border:1.5px solid var(--brand,#0F30B3);padding:2px 10px;white-space:nowrap;pointer-events:none}
</style>
